<!DOCTYPE html>
<html>
<body style="margin:0;
             height:100vh;
             display:flex;
             justify-content:center;
             align-items:center;
             background:linear-gradient(45deg,purple,pink,orange);
             font-family:poppins;">

<!-- MAIN BOX -->
<div style="width:320px;
            background:white;
            padding:15px;
            border-radius:15px;
            box-shadow:0 0 20px purple;
            text-align:center;">

<h2>🤖 Zyrii Bot</h2>

<!-- CHAT AREA -->
<div style="background:rgb(243, 236, 236);
            height:200px;
            padding:10px;
            border-radius:10px;
            text-align:left;
            overflow:auto;">

<p><b>Zyrii:</b> Hello 👋</p>
<p><b>You:</b> Hi</p>
<p><b>Zyrii:</b> How can I help?</p>

</div>

<!-- INPUT -->
<input type="text"
       placeholder="Type message..."
       style="width:90%;
              padding:8px;
              margin-top:10px;
              border-radius:10px;
              border:1px solid whitesmoke">

<!-- BUTTON -->
<br><br>
<button style="padding:8px 15px;
               border:none;
               border-radius:10px;
               background:purple;
               color:white;">
Send
</button>

</div>

</body>
</html>
